<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e301a"/>
      <stop offset="50%" stop-color="#081c0e"/>
      <stop offset="100%" stop-color="#030b05"/>
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe89c"/>
      <stop offset="30%" stop-color="#f5c542"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>

    <!-- Gold Emblem Gradient -->
    <linearGradient id="goldEmblem" x1="0" y1="100" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="30%" stop-color="#f5c542"/>
      <stop offset="70%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="14"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#goldBorder)" stroke-width="4" stroke-dasharray="8 6" opacity="0.5"/>
  <circle cx="256" cy="256" r="195" stroke="url(#goldBorder)" stroke-width="5" opacity="0.75"/>

  <!-- Golden Crown & Spade Emblem Center -->
  <g filter="url(#goldGlow)">
    <!-- Spade Symbol background glow -->
    <path d="M256 110 C230 160 160 210 160 260 C160 300 190 320 225 320 C245 320 256 305 256 305 C256 305 267 320 287 320 C322 320 352 300 352 260 C352 210 282 160 256 110 Z" fill="url(#goldEmblem)" opacity="0.2"/>
    <path d="M242 310 L270 310 L276 355 L236 355 Z" fill="url(#goldEmblem)" opacity="0.2"/>

    <!-- Royal Crown -->
    <path d="M160 270 L180 170 L225 220 L256 140 L287 220 L332 170 L352 270 Z" fill="url(#goldEmblem)"/>
    
    <!-- Crown Jewels -->
    <circle cx="180" cy="160" r="10" fill="#fff4c2"/>
    <circle cx="256" cy="130" r="12" fill="#fff4c2"/>
    <circle cx="332" cy="160" r="10" fill="#fff4c2"/>
    
    <!-- Crown Base Band -->
    <rect x="156" y="275" width="200" height="24" rx="6" fill="url(#goldEmblem)" stroke="#ffe89c" stroke-width="2"/>
    <circle cx="196" cy="287" r="5" fill="#ef4444"/>
    <circle cx="256" cy="287" r="6" fill="#3b82f6"/>
    <circle cx="316" cy="287" r="5" fill="#ef4444"/>
  </g>

  <!-- BETPULSE Brand Text in Icon -->
  <text x="256" y="365" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="40" fill="url(#goldEmblem)" text-anchor="middle" letter-spacing="4">BETPULSE</text>
  <text x="256" y="405" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="18" fill="#ffffff" opacity="0.85" text-anchor="middle" letter-spacing="7">PRO CASINO</text>
</svg>
