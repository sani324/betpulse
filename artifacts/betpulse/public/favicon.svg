<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Contrast Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#143d23"/>
      <stop offset="60%" stop-color="#081c0e"/>
      <stop offset="100%" stop-color="#020804"/>
    </radialGradient>

    <!-- Metallic Gold Contrast Border -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe89c"/>
      <stop offset="50%" stop-color="#f5c542"/>
      <stop offset="75%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Crown Gold Contrast Gradient -->
    <linearGradient id="crownGold" x1="0" y1="120" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffeba1"/>
      <stop offset="50%" stop-color="#f5c542"/>
      <stop offset="80%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#85580c"/>
    </linearGradient>

    <!-- High Contrast Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="16"/>

  <!-- High-Contrast Neon Inner Ring -->
  <circle cx="256" cy="245" r="190" stroke="url(#goldBorder)" stroke-width="4" stroke-dasharray="10 8" opacity="0.65"/>
  <circle cx="256" cy="245" r="175" stroke="#10b981" stroke-width="6" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Royal Golden Crown (High Contrast Centerpiece) -->
  <g filter="url(#neonGlow)">
    <!-- 3D Shadow -->
    <path d="M140 270 L165 155 L215 210 L256 120 L297 210 L347 155 L372 270 Z" fill="#000000" opacity="0.4" transform="translate(0, 8)"/>
    
    <!-- Main Gold Crown -->
    <path d="M140 270 L165 155 L215 210 L256 120 L297 210 L347 155 L372 270 Z" fill="url(#crownGold)"/>
    
    <!-- Crown Orbs / Jewels -->
    <circle cx="165" cy="145" r="12" fill="#ffffff" stroke="#f5c542" stroke-width="3"/>
    <circle cx="256" cy="110" r="15" fill="#ffffff" stroke="#f5c542" stroke-width="4"/>
    <circle cx="347" cy="145" r="12" fill="#ffffff" stroke="#f5c542" stroke-width="3"/>

    <circle cx="215" cy="205" r="7" fill="#ef4444"/>
    <circle cx="297" cy="205" r="7" fill="#3b82f6"/>
    
    <!-- Crown Base Band with Rubies & Emeralds -->
    <rect x="136" y="276" width="240" height="28" rx="8" fill="url(#crownGold)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="180" cy="290" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="256" cy="290" r="8" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="332" cy="290" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- High-Contrast Bold Text -->
  <text x="256" y="375" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">BETPULSE</text>
  <text x="256" y="415" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="20" fill="#f5c542" text-anchor="middle" letter-spacing="8">PRO CASINO</text>
</svg>
