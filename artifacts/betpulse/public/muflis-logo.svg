<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d001a"/>
      <stop offset="40%" stop-color="#2e1065"/>
      <stop offset="70%" stop-color="#1e0a4a"/>
      <stop offset="100%" stop-color="#0d001a"/>
    </linearGradient>
    <linearGradient id="mcard-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="mcard-face" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fffef5"/>
      <stop offset="50%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="msilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="30%" stop-color="#c4b5fd"/>
      <stop offset="60%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="mgold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="mglow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mcardshadow">
      <feDropShadow dx="3" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <pattern id="mdots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="rgba(139,92,246,0.15)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="url(#mbg)"/>
  <rect width="320" height="200" fill="url(#mdots)"/>

  <!-- Ambient glow -->
  <ellipse cx="160" cy="95" rx="130" ry="75" fill="rgba(109,40,217,0.14)" filter="url(#mglow)"/>
  <ellipse cx="160" cy="95" rx="65" ry="40" fill="rgba(196,181,253,0.07)" filter="url(#mglow)"/>

  <!-- Back left card (purple back) -->
  <g transform="rotate(-20, 90, 108)" filter="url(#mcardshadow)">
    <rect x="28" y="46" width="80" height="114" rx="9" fill="url(#mcard-blue)" opacity="0.88"/>
    <rect x="32" y="50" width="72" height="106" rx="7" fill="none" stroke="rgba(196,181,253,0.4)" stroke-width="1.5"/>
    <text x="68" y="112" text-anchor="middle" font-size="26" fill="rgba(255,255,255,0.1)" font-family="serif">♠</text>
  </g>

  <!-- Back right card (purple back) -->
  <g transform="rotate(16, 230, 108)" filter="url(#mcardshadow)">
    <rect x="182" y="46" width="80" height="114" rx="9" fill="url(#mcard-blue)" opacity="0.82"/>
    <rect x="186" y="50" width="72" height="106" rx="7" fill="none" stroke="rgba(196,181,253,0.35)" stroke-width="1.5"/>
    <text x="222" y="112" text-anchor="middle" font-size="26" fill="rgba(255,255,255,0.1)" font-family="serif">♥</text>
  </g>

  <!-- Main front card: 2 of Spades (low value = Muflis) -->
  <g filter="url(#mcardshadow)">
    <rect x="102" y="26" width="116" height="152" rx="12" fill="url(#mcard-face)"/>
    <rect x="106" y="30" width="108" height="144" rx="10" fill="none" stroke="url(#msilver)" stroke-width="2.5"/>

    <!-- Top-left: 2♠ -->
    <text x="118" y="54" font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="#1e1b4b">2</text>
    <text x="120" y="68" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#1e1b4b">♠</text>

    <!-- Bottom-right: 2♠ rotated -->
    <g transform="rotate(180, 202, 148)">
      <text x="188" y="136" font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="#1e1b4b">2</text>
      <text x="190" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#1e1b4b">♠</text>
    </g>

    <!-- Two small pips top -->
    <text x="160" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e1b4b">♠</text>
    <!-- Two small pips bottom -->
    <text x="160" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e1b4b" transform="rotate(180,160,143)">♠</text>
  </g>

  <!-- "MUFLIS" title bar -->
  <rect x="60" y="162" width="200" height="30" rx="9" fill="rgba(0,0,0,0.6)"/>
  <text x="160" y="182" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" letter-spacing="5" fill="url(#mgold)">MUFLIS</text>

  <!-- "Lowest Hand Wins" sub -->
  <text x="160" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" letter-spacing="2" fill="rgba(196,181,253,0.55)">LOWEST HAND WINS</text>

  <!-- Corner suit decorations -->
  <text x="18"  y="50"  font-size="17" fill="rgba(196,181,253,0.32)" font-family="serif">♣</text>
  <text x="288" y="48"  font-size="15" fill="rgba(196,181,253,0.28)" font-family="serif">♥</text>
  <text x="16"  y="175" font-size="15" fill="rgba(196,181,253,0.28)" font-family="serif">♦</text>
  <text x="287" y="173" font-size="17" fill="rgba(196,181,253,0.32)" font-family="serif">♠</text>

  <!-- Sparkle dots -->
  <circle cx="55"  cy="38"  r="2.2" fill="#a78bfa" opacity="0.65"/>
  <circle cx="265" cy="36"  r="1.8" fill="#a78bfa" opacity="0.6"/>
  <circle cx="46"  cy="160" r="1.6" fill="#a78bfa" opacity="0.5"/>
  <circle cx="274" cy="158" r="2"   fill="#a78bfa" opacity="0.6"/>
  <circle cx="160" cy="20"  r="1.8" fill="#a78bfa" opacity="0.5"/>
</svg>
