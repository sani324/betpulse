<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="jbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a1a"/>
      <stop offset="40%" stop-color="#005a5a"/>
      <stop offset="70%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#001a1a"/>
    </linearGradient>
    <linearGradient id="jgold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="jcyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="jglow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="jdots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.8" fill="rgba(34,211,238,0.15)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="url(#jbg)"/>
  <rect width="320" height="200" fill="url(#jdots)"/>
  <ellipse cx="160" cy="90" rx="140" ry="80" fill="rgba(14,116,144,0.12)" filter="url(#jglow)"/>

  <!-- 6 Dice in 2×3 grid, centered -->
  <!-- Die 1: ♥ Heart (top-left) -->
  <g transform="translate(44,28)">
    <rect width="56" height="56" rx="10" fill="#fffef5" stroke="url(#jgold)" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" font-size="28" fill="#dc2626">♥</text>
  </g>
  <!-- Die 2: ♦ Diamond (top-center) -->
  <g transform="translate(132,28)">
    <rect width="56" height="56" rx="10" fill="#fffef5" stroke="url(#jgold)" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" font-size="28" fill="#dc2626">♦</text>
  </g>
  <!-- Die 3: ♣ Club (top-right) -->
  <g transform="translate(220,28)">
    <rect width="56" height="56" rx="10" fill="#fffef5" stroke="url(#jgold)" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" font-size="28" fill="#1e3a8a">♣</text>
  </g>
  <!-- Die 4: ♠ Spade (bottom-left) -->
  <g transform="translate(44,92)">
    <rect width="56" height="56" rx="10" fill="#fffef5" stroke="url(#jgold)" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" font-size="28" fill="#1e3a8a">♠</text>
  </g>
  <!-- Die 5: 👑 Raja (bottom-center) -->
  <g transform="translate(132,92)">
    <rect width="56" height="56" rx="10" fill="#fffef5" stroke="url(#jgold)" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" font-size="24" fill="#d97706">👑</text>
  </g>
  <!-- Die 6: 🚩 Flag (bottom-right) -->
  <g transform="translate(220,92)">
    <rect width="56" height="56" rx="10" fill="#fffef5" stroke="url(#jgold)" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" font-size="24" fill="#dc2626">🚩</text>
  </g>

  <!-- Title bar -->
  <rect x="30" y="158" width="260" height="34" rx="10" fill="rgba(0,0,0,0.6)"/>
  <text x="160" y="171" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" letter-spacing="3" fill="url(#jcyan)">JHANDI</text>
  <text x="160" y="185" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" letter-spacing="3" fill="url(#jgold)">MUNDA</text>

  <!-- Sparkle corners -->
  <circle cx="22" cy="22" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="298" cy="22" r="2" fill="#f5c542" opacity="0.6"/>
  <circle cx="22" cy="155" r="2" fill="#f5c542" opacity="0.5"/>
  <circle cx="298" cy="155" r="2" fill="#22d3ee" opacity="0.5"/>
</svg>
