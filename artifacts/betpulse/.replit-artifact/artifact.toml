kind = "web"
previewPath = "/"
title = "BetPulse"
version = "1.0.0"
id = "artifacts/betpulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23811

[services.development]
run = "pnpm --filter @workspace/betpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/betpulse", "run", "build" ]
publicDir = "artifacts/betpulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23811"
BASE_PATH = "/"
